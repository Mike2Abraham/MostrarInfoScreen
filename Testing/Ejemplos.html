<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo - MostrarInfoScreen 📢</title>
    <link rel="stylesheet" href="./styles.css">

    <!-- ===== IMPORTAR ===== 
    <script type="module" src="../MostrarInfoScreen/Notificacion_SP.js"></script> -->
    <script src="../MostrarInfoScreen/Notificacion-SP.js"></script>

</head>
<body>
<img style="
    position: fixed;
    left: 0;
    top: 0;
    display: flex;
    width: 100%;
    height: 100%;
    z-index: -1;" src="./japan-artistic_resultado.png">

<div class="container">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <h1>
            📢 MostrarInfoScreen
            <span class="badadge">v4.0.0</span>
        </h1>
        <p>Demostración interactiva de todas las capacidades</p>
        <div class="stats">
            <span>📦 <strong>25KB</strong></span>
            <span>🎨 <strong>8+</strong> modos</span>
            <span>🔧 <strong>15+</strong> parámetros</span>
            <span>📋 <strong>12</strong> ejemplos</span>
        </div>
    </div>

    <!-- ===== FILTROS ===== -->
    <div class="filters" id="filters">
        <button class="active" data-filter="all">📋 Todos</button>
        <button data-filter="basico">🔤 Básico</button>
        <button data-filter="etiqueta">🏷️ Etiqueta</button>
        <button data-filter="dialogo">💬 Diálogo</button>
        <button data-filter="iconos">🎨 Iconos</button>
        <button data-filter="botones">🔘 Botones</button>
        <button data-filter="fondo">🖼️ Fondos</button>
        <button data-filter="tarea">🆔 Tareas</button>
        <button data-filter="input">⌨️ Inputs</button>
        <button data-filter="avanzado">🚀 Avanzado</button>
    </div>

    <!-- ===== GRID DE EJEMPLOS ===== -->
    <div class="examples-grid" id="examplesGrid">
        <!-- Los ejemplos se cargarán con JavaScript -->
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        <p>
            Desarrollado con ❤️ por <strong>Abraham de Jesús Piñirí Megret</strong> &bull;
            <a href="https://github.com/Mike2Abraham/MostrarInfoScreen" target="_blank">Ver en GitHub</a>
        </p>
        <p style="margin-top: 0.5rem; font-size: 0.75rem;">
            Haz clic en <strong>▶ Test</strong> para probar cada ejemplo en vivo
        </p>
    </div>
</div>

<script src="logica.js"></script>
<script>
// ============================================================
// 1. VERIFICAR QUE LA FUNCIÓN ESTÉ CARGADA
// ============================================================
console.log('🔍 Verificando MostrarInfoScreen...');

setTimeout(() => {
    if (typeof MostrarInfoScreen === 'undefined') {
        console.error('❌ MostrarInfoScreen no está definida. Asegúrate de importar el script correctamente.');
        document.body.innerHTML = `
            <div style="text-align:center;padding:4rem;color:#f85149;">
                <h1>❌ Error</h1>
                <p>No se pudo cargar la función <strong>MostrarInfoScreen</strong></p>
                <p style="color:#8b949e;font-size:0.9rem;">
                    Verifica que el script esté en la URL correcta:
                    <br>
                    <code style="background:#161b22;padding:0.5rem;display:inline-block;border-radius:4px;margin-top:0.5rem;">
                        https://raw.githubusercontent.com/Mike2Abraham/MostrarInfoScreen/refs/heads/main/MostrarInfoScreen/Notificacion_SP.js
                    </code>
                </p>
            </div>
        `;
        throw new Error('MostrarInfoScreen no cargada');
    }
    console.log('✅ MostrarInfoScreen cargada exitosamente');
}, 900)


// ============================================================
// 3. RENDERIZAR EJEMPLOS
// ============================================================
function renderizarEjemplos(filtro = 'all') {
    const grid = document.getElementById('examplesGrid');
    grid.innerHTML = '';
    
    const filtrados = filtro === 'all' 
        ? ejemplos 
        : ejemplos.filter(e => e.categoria === filtro);
    
    if (filtrados.length === 0) {
        grid.innerHTML = `
            <div style="text-align:center;padding:4rem;color:#8b949e;grid-column:1/-1;">
                <p style="font-size:1.5rem;">🔍 No hay ejemplos en esta categoría</p>
            </div>
        `;
        return;
    }
    
    filtrados.forEach((ejemplo, index) => {
        const card = document.createElement('div');
        card.className = 'example-card';
        card.id = `ejemplo-${ejemplo.id}`;
        
         
        const codigoPlano = ejemplo.codigo;
          //  .replace(/&/g, '&amp;')
          //  .replace(/</g, '&lt;')
          //  .replace(/>/g, '&gt;')
          //  .replace(/(MostrarInfoScreen)/g, '<span class="function">$1</span>')
          //  .replace(/(text|text2|text3|duration|icono|etiqueta|dialogo|emoji|img|audio|fondo|botones|tareaID|input|tipo|placeholder|id|accion|cargando|cerrarAlCompletar|estilos|color|blur|gradiente|operacion|crear|cerrar|llamar)/g, '<span class="keyword">$1</span>')
          //  .replace(/(".*?")/g, '<span class="string">$1</span>')
          //  .replace(/(\d+)/g, '<span class="number">$1</span>')
          //  .replace(/\/\/.*/g, '<span class="comment">$&</span>')
          //  .replace(/(async|await|function|const|let|var|return|new|setTimeout)/g, '<span class="keyword">$1</span>');
        
        card.innerHTML = `
            <div class="example-header">
                <span class="title">${ejemplo.titulo}</span>
                <span class="category">${ejemplo.categoria}</span>
            </div>
            <div class="example-body">
                <div class="description">${ejemplo.descripcion}</div>
                <div class="code-block">
                    <button class="copy-btn" onclick="copiarCodigo(this)">📋 Copiar</button>
                    <pre style="margin:0;white-space:pre-wrap;word-break:break-all;color:#e6edf3;">${codigoPlano}</pre>
                </div>
                <button class="test-btn" onclick="ejecutarTest(${index})">
                    <span class="icon">▶</span> Test
                </button>
                <div class="result-area" id="result-${ejemplo.id}">
                    <span class="info">⏳ Ejecutando...</span>
                </div>
            </div>
        `;
        
        grid.appendChild(card);
    });
}

// ============================================================
// 4. FUNCIONES DE CONTROL
// ============================================================
function ejecutarTest(index) {
    const ejemplo = ejemplos[index];
    const resultArea = document.getElementById(`result-${ejemplo.id}`);
    
    if (!resultArea) return;
    
    resultArea.classList.add('show');
    resultArea.innerHTML = `<span class="info">⏳ Ejecutando...</span>`;
    
    try {
        // Ejecutar el test
        ejemplo.test();
        
        // Resultado exitoso (la notificación ya se muestra)
        setTimeout(() => {
            resultArea.innerHTML = `<span class="success">✅ Ejecutado correctamente</span>`;
        }, 500);
        
    } catch (error) {
        resultArea.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
        console.error('Error en test:', error);
    }
}

function copiarCodigo(btn) {
    const block = btn.closest('.code-block');
    const pre = block.querySelector('pre');
    const texto = pre.textContent.trim();
    
    navigator.clipboard.writeText(texto).then(() => {
        btn.textContent = '✅ Copiado';
        setTimeout(() => {
            btn.textContent = '📋 Copiar';
        }, 2000);
    }).catch(() => {
        // Fallback
        const range = document.createRange();
        range.selectNode(pre);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        btn.textContent = '✅ Copiado';
        setTimeout(() => {
            btn.textContent = '📋 Copiar';
        }, 2000);
    });
}

// ============================================================
// 5. FILTROS
// ============================================================
document.querySelectorAll('#filters button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderizarEjemplos(btn.dataset.filter);
    });
});

// ============================================================
// 6. INICIALIZAR
// ============================================================
renderizarEjemplos('all');

console.log('🚀 Demo de MostrarInfoScreen cargada correctamente');
console.log(`📊 ${ejemplos.length} ejemplos disponibles`);
</script>

</body>
</html>
